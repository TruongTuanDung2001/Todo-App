<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <!-- link css, fornt awesome -->
    <link rel="stylesheet" href="/css/sidebar-left.css">
    <link rel="stylesheet" href="/css/main-content.css">
    <link rel="stylesheet" href="/css/sidebar-right.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- https://cdnjs.com/libraries/font-awesome lấy link-->
    <!-- https://fontawesome.com/search?ic=free-collection sử dụng icon free-->
</head>
<body>
    <div class="app">
        <div class="layout">
            <!-- SIDEBAR LEFT -->
            <div class="sidebar sidebar--left">
                <div class="sidebar__header">
                    <div class="sidebar__logo">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div class="sidebar__title" data-page="dashboard" >My Task</div>
                </div>
                
                <div class="sidebar__info">
                    <div class="sidebar__avatar">
                        <img src="/image/avatar.jpg" alt="">
                    </div>
                    <div class="sidebar__name">
                        Trương Tuấn Dũng
                    </div>
                    <!-- <div class="sidebar__email">
                        truongtuandung2001@gmail.com
                    </div> -->
                </div>

                <ul class="sidebar__menu">
                    <li class="sidebar__item">
                        <div class="sidebar__item-icon">
                            <i class="fa-regular fa-house"></i>
                        </div>
                        <a href="#" data-page="dashboard"  class="sidebar__item-link">Home</a>
                    </li>
                    <li class="sidebar__item">
                        <div class="sidebar__item-icon">
                            <i class="fa-regular fa-bookmark"></i>
                        </div>
                        <a href="#" data-page="save" class="sidebar__item-link">Save</a>
                    </li>
                    <li class="sidebar__item">
                        <div class="sidebar__item-icon">
                            <i class="fa-regular fa-square-plus"></i>
                        </div>
                        <a href="#" data-page="create-task" class="sidebar__item-link">Create task</a>
                    </li>
                    <li class="sidebar__item">
                        <div class="sidebar__item-icon">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </div>
                        <a href="#" data-page="edit-task" class="sidebar__item-link">Edit task</a>
                    </li>
                    <li class="sidebar__item">
                        <div class="sidebar__item-icon">
                            <i class="fa-solid fa-download"></i>
                        </div>
                        <a href="" class="sidebar__item-link">Download</a>
                    </li>
                    <li class="sidebar__item">
                        <div class="sidebar__item-icon">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>    
                        </div>
                        <a href="" class="sidebar__item-link sidebar__logout">Logout</a>    
                    </li>
                </ul>
            </div>  

            <!-- MAIN -->
            <div class="layout__main">

            
            </div>

            <!-- SIDEBAR RIGHT -->
            <div class="sidebar sidebar--right">
                <!-- Lịch làm việc ngày hiện tại -->
                <div class="sidebar__header">
                    <div class="sidebar__logo">
                        <i class="fa-regular fa-calendar-days"></i>
                    </div>
                    <div class="sidebar__title today">
                        <!-- Wednesday 2026 -->
                    </div>
                </div>
                <!--  -->
                <div class="sidebar__filter">
                    <select class="filter-option">
                        <option value="all">All</option>
                        <option value="today">Today</option>
                        <option value="past">Past</option>
                        <option value="future">Future</option>
                        <option value="done">Done</option>
                        <option value="active">Active</option>
                    </select>
                </div>
                <!--  -->
                <ul class="sidebar__tasks">
                    <div class="sidebar__tasks-date">
                        Wnd 3, 2026
                    </div>
                    <li class="sidebar__item">
                        <div class="sidebar__item-time">
                            <p>10:00</p>
                            <span>Lorem</span>
                        </div>

                        <div class="sidebar__item-content">
                            Lorem ipsum dolor 
                        </div>
                    </li>
                    <!--  -->
                    <li class="sidebar__item">
                        <div class="sidebar__item-time">
                            <p>10:00</p>
                            <span>Lorem</span>
                        </div>

                        <div class="sidebar__item-content">
                            Lorem, ipsum dolor.
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <!--  -->
</body>
<script src="/js/script.js"></script>
<script src="/js/api.js"></script>
<script src="/js/router.js"></script>
<script src="/js/save.js"></script>
<script src="/js/create-task.js"></script>
<script src="/js/edit-task.js"></script>
</html>
