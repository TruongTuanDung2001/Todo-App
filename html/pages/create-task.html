<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/create-task.css">
    <title>Create task page</title>
</head>
<body>
    <!--  -->
    <div class="createTask">
        <div class="createTask__header">
            <h1>Create New Task</h1>
            <p>Create and schedule your next task</p>
        </div>
        <form class="createTask__form">
            <!-- Title -->
            <div class="formGroup">
                <label>Task Title</label>
                <input
                type="text" class="input inputTitle" placeholder="Ex: Learn Fetch API">
            </div>

            <!-- Description -->
            <div class="formGroup">
                <label>Description</label>
                <textarea class="input inputDescription textarea" placeholder="Task description..."></textarea>
            </div>

            <!-- Status + Priority -->
            <div class="row">
                <div class="formGroup">
                    <label>Status</label>
                    <select class="input inputStatus">
                        <option value="active">Active</option>
                        <option value="done">Done</option>
                    </select>
                </div>

                <div class="formGroup">
                    <label>Priority</label>
                    <select class="input inputPriority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>

            <!-- Date -->
            <div class="row">
                <div class="formGroup">
                    <label>Start Date</label>
                    <input type="date" class="input inputDate">
                </div>

                <div class="formGroup">
                    <label>Start Time</label>
                    <input type="time" class="input inputFormGroup">
                </div>
            </div>

            <!-- Deadline -->
            <div class="formGroup">
                <label>Deadline</label>
                <input type="date" class="input inputDeadline">
            </div>

            <!-- Preview -->
            <div class="preview">
                <h3>Preview</h3>
                <div class="previewCard">
                    <div class="previewTop"></div>
                    <div class="previewBody">
                        Task Title
                    </div>
                </div>
            </div>

            <button type="button" class="btnCreate">
                Create Task
            </button>
        </form>
    </div>
    <!--  -->
    
</body>
</html>
