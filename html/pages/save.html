<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Page</title>
    <link rel="stylesheet" href="/css/save.css">
</head>
<body>
    <div class="save">

    <!-- Header -->
    <div class="save__header">

        <h1 class="save__title">
            Saved Tasks
        </h1>

        <div class="save__count">

            Saved:
            <span>6</span>

        </div>

    </div>

    <!-- Search -->
    <div class="save__search">

        <input
        type="text"
        placeholder="Search saved task..."
        >

    </div>

    <!-- List -->
    <div class="save__list">

        <!-- Item -->

        <div class="save-task">

            <div class="save-task__top"></div>

            <div class="save-task__content">

                <div class="save-task__title">

                    Learn Fetch API

                </div>

                <div class="save-task__desc">

                    GET POST PUT DELETE

                </div>

                <div class="save-task__bottom">

                    <span>
                        2026-06-13
                    </span>

                    <button>

                        Open

                    </button>

                </div>

            </div>

        </div>


        <div class="save-task">

            <div class="save-task__top save-task__top--green"></div>

            <div class="save-task__content">

                <div class="save-task__title">

                    Build Login

                </div>

                <div class="save-task__desc">

                    Login UI

                </div>

                <div class="save-task__bottom">

                    <span>

                        2026-06-11

                    </span>

                    <button>

                        Open

                    </button>

                </div>

            </div>

        </div>

    </div>

    </div>

    <!-- script -->

</body>
</html>
